apiVersion: v1
kind: ServiceAccount
metadata:
  name: haven-console
  namespace: haven-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: haven-console-reader
rules:
  - apiGroups: [identity.haven.dev]
    resources: [identityplanes]
    verbs: [get, list, watch]
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: haven-console-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: haven-console-reader
subjects:
  - kind: ServiceAccount
    name: haven-console
    namespace: haven-ui
