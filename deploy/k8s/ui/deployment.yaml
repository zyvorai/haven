apiVersion: v1
kind: Namespace
metadata:
  name: haven-ui
  labels:
    app.kubernetes.io/part-of: haven
---
apiVersion: v1
kind: Secret
metadata:
  name: haven-keycloak-admin
  namespace: haven-ui
type: Opaque
stringData:
  KEYCLOAK_URL: "http://KEYCLOAK_HOST:30180"
  KEYCLOAK_ADMIN_USER: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "changeme"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haven-console-config
  namespace: haven-ui
data:
  HAVEN_BOOTSTRAP_REALM: "platform"
  HAVEN_LAB_LOGIN: "1"
  KEYCLOAK_ADMIN_URL: "http://KEYCLOAK_HOST:30180/admin"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haven-console
  namespace: haven-ui
  labels:
    app: haven-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haven-console
  template:
    metadata:
      labels:
        app: haven-console
    spec:
      serviceAccountName: haven-console
      containers:
        - name: console
          image: haven-console:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HAVEN_PLANE_NAME
              value: "platform"
            - name: HAVEN_PLANE_NAMESPACE
              value: "identity"
          envFrom:
            - secretRef:
                name: haven-keycloak-admin
            - configMapRef:
                name: haven-console-config
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: haven-console-nodeport
  namespace: haven-ui
  labels:
    app: haven-console
spec:
  type: NodePort
  selector:
    app: haven-console
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30742
