apiVersion: v1
kind: Namespace
metadata:
  name: haven-ui
  labels:
    app.kubernetes.io/part-of: haven
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haven-web-config
  namespace: haven-ui
data:
  config.json: |
    {
      "keycloakUrl": "http://KEYCLOAK_HOST:30180",
      "keycloakAdminUrl": "http://KEYCLOAK_HOST:30180/admin",
      "keycloakNamespace": "argus-enterprise"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haven-web
  namespace: haven-ui
  labels:
    app: haven-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: haven-web
  template:
    metadata:
      labels:
        app: haven-web
    spec:
      containers:
        - name: web
          image: haven-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: runtime-config
          configMap:
            name: haven-web-config
---
apiVersion: v1
kind: Service
metadata:
  name: haven-web-nodeport
  namespace: haven-ui
  labels:
    app: haven-web
spec:
  type: NodePort
  selector:
    app: haven-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30742
